name: Build APK (sync-plus branch)

on:
  push:
    branches: [sync-plus-sdp-retry]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --stacktrace
      - name: Upload DiPlay APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-sync-plus-sdp-retry
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-sync-plus
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
